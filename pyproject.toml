[project]
name = "esignature"
version = "0.1.0"
description = "Keboola eSignature - sign PDF documents with P12/PFX certificates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0.0",
    "fastapi>=0.162.0",
    "pillow>=10.0.0",
    "pyhanko>=0.38.0",
    "pyhanko-certvalidator>=0.33.0",
    "pymupdf>=1.26.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
esignature = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "config.py", "signer.py", "geometry.py", "static", "fonts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.3",
]
